name: Ucus Hata Fiyati Radari

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Radari calistir
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python app.py

      - name: Fiyat gecmisini kaydet
        run: |
          git config user.name "Ucus Hata Fiyati Radari"
          git config user.email "actions@github.com"

          git add prices.db

          if git diff --cached --quiet; then
            echo "Yeni fiyat verisi yok."
          else
            git commit -m "Fiyat gecmisini guncelle"
            git push
          fi
